name: Formal fast checks

on:
  pull_request:
    branches: [main, fv/m1.1-foundation]
  push:
    branches: [main, fv/m1.1-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formal-fast:
    name: Lean build and fast tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Lean build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: formal/.lake
          key: formal-fast-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json', '.github/workflows/formal-fast.yml') }}-${{ github.sha }}
          restore-keys: |
            formal-fast-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json', '.github/workflows/formal-fast.yml') }}-

      - name: Set up pinned Lean toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          lake-package-directory: formal
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"

      - name: Set up Z3 4.15.2
        shell: bash
        run: |
          set -euo pipefail
          z3_archive="$RUNNER_TEMP/z3-4.15.2-x64-glibc-2.39.zip"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            https://github.com/Z3Prover/z3/releases/download/z3-4.15.2/z3-4.15.2-x64-glibc-2.39.zip \
            --output "$z3_archive"
          printf '%s  %s\n' 85d2da1bf440fca3288874c2a06e23f96d09befcc21b5a7489fe0fa40444e685 "$z3_archive" | sha256sum --check
          unzip -q "$z3_archive" -d "$RUNNER_TEMP/upv-z3"
          echo "$RUNNER_TEMP/upv-z3/z3-4.15.2-x64-glibc-2.39/bin" >> "$GITHUB_PATH"

      - name: Record tool versions
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/ci-setup
          lake env lean --version | tee output/ci-setup/lean-version.log
          z3 --version | tee output/ci-setup/z3-version.log
          [[ "$(z3 --version)" == "Z3 version 4.15.2 "* ]]

      - name: Build and run fast checks
        run: bash formal/scripts/ci-fast.sh

      - name: Retain fast-check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: formal/output/
          if-no-files-found: warn
          retention-days: 14

